[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-backend"
version = "0.1.0"
description = "Discharge medication recommendation for multimorbid (hypertension + admission condition) patients — backend"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pandas>=2",
    "PyYAML>=6",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "mcp>=1.0",
    "openai>=1.50",
    "fastapi>=0.110",
    "duckdb>=0.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]
serve = [
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cds = ["medications/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
