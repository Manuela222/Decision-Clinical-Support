# Default medication synonym + class dictionary (Phase 4).
#
# `synonyms` maps common brand names / abbreviations to a normalized base
# ingredient name (post dosage/route/salt stripping, see normalize.py).
# `classes` maps that same normalized base ingredient name to one entry in
# the fixed medication-class vocabulary. `antihypertensive_classes` lists
# which of those class names are treated as HTN-related for the project's
# label-exclusion / safety-check split.
#
# Built from the Phase 0 feasibility audit's highest-frequency discharge
# DRUG strings in the filtered cohort (see FEASIBILITY_REPORT.md, Section 4)
# plus a follow-up pass over that audit's "Other/Unmapped" list to broaden
# coverage. This is still not exhaustive — anything not listed here falls
# back to "Other/Unmapped" in map_to_medication_class(), which is expected
# and should keep shrinking as real gaps are found in later phases.

synonyms:
  lasix: furosemide
  tylenol: acetaminophen
  coumadin: warfarin
  zocor: simvastatin
  lopressor: metoprolol
  glucophage: metformin
  toprol: metoprolol
  norvasc: amlodipine
  prinivil: lisinopril
  zestril: lisinopril
  diovan: valsartan
  cozaar: losartan
  dw: dextrose
  d w: dextrose
  d5w: dextrose
  d10w: dextrose
  d5ns: dextrose
  ns: sodium chloride
  sw: sterile water
  lr: lactated ringers
  unasyn: ampicillin-sulbactam
  neurontin: gabapentin
  ultram: tramadol
  benadryl: diphenhydramine
  zofran: ondansetron
  reglan: metoclopramide
  protonix: pantoprazole
  prilosec: omeprazole
  zantac: ranitidine
  pepcid: famotidine
  ativan: lorazepam
  versed: midazolam
  ambien: zolpidem
  haldol: haloperidol
  seroquel: quetiapine
  zyprexa: olanzapine
  lanoxin: digoxin
  cardizem: diltiazem
  procardia: nifedipine

